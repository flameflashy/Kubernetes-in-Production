{{- if .Values.policies.personLabel.enabled }}
{{- $policy := .Values.policies.personLabel }}
{{- if has $policy.mentorNamespace $policy.studentNamespaces }}
{{- fail "policies.personLabel.mentorNamespace must not also appear in studentNamespaces" }}
{{- end }}
{{- $labNamespaces := concat $policy.studentNamespaces (list $policy.mentorNamespace) | uniq }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: set-person-label-by-namespace
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/part-of: lab-policies
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: Set person label by namespace
    policies.kyverno.io/category: Metadata
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Sets the configured identity label in lab namespaces and removes it from
      Pods admitted in every other namespace.
spec:
  background: {{ $policy.background }}
  emitWarning: {{ $policy.emitWarning }}
  rules:
    - name: label-student-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
{{- toYaml $policy.studentNamespaces | nindent 16 }}
              operations:
                - CREATE
                - UPDATE
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              {{ $policy.labelKey }}: {{ $policy.studentValue | quote }}
    - name: label-mentor-pods
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ $policy.mentorNamespace }}
              operations:
                - CREATE
                - UPDATE
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              {{ $policy.labelKey }}: {{ $policy.mentorValue | quote }}
    - name: remove-person-label-outside-lab-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
                - UPDATE
      exclude:
        any:
          - resources:
              namespaces:
{{- toYaml $labNamespaces | nindent 16 }}
      preconditions:
        all:
          - key: {{ $policy.labelKey }}
            operator: AnyIn
            value: {{ printf "%s" "{{ keys(request.object.metadata.labels || `{}`) }}" | quote }}
      mutate:
        patchesJson6902: |-
          - op: remove
            path: /metadata/labels/{{ $policy.labelKey }}
{{- end }}
