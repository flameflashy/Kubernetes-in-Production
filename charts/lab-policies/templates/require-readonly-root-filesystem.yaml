{{- if .Values.policies.readonlyRootFilesystem.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-readonly-root-filesystem
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/part-of: lab-policies
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: Require read-only root filesystem
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Reports or rejects workload containers that can write to their root
      filesystem in a configured lab namespace.
spec:
  background: {{ .Values.policies.readonlyRootFilesystem.background }}
  emitWarning: {{ .Values.policies.readonlyRootFilesystem.emitWarning }}
  rules:
    - name: check-readonly-root-filesystem
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
{{- toYaml .Values.policies.readonlyRootFilesystem.namespaces | nindent 16 }}
      validate:
        failureAction: {{ .Values.policies.readonlyRootFilesystem.failureAction }}
        message: >-
          Every container, initContainer, and ephemeralContainer must set
          securityContext.readOnlyRootFilesystem to true.
        foreach:
          - list: request.object.spec.containers
            pattern:
              securityContext:
                readOnlyRootFilesystem: true
          - list: request.object.spec.initContainers
            pattern:
              securityContext:
                readOnlyRootFilesystem: true
          - list: request.object.spec.ephemeralContainers
            pattern:
              securityContext:
                readOnlyRootFilesystem: true
{{- end }}
