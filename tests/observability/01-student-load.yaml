apiVersion: v1
kind: Pod
metadata:
  name: student-load
  namespace: student02
spec:
  containers:
    - name: load
      image: busybox:1.37
      command:
        - sh
        - -c
        - while true; do :; done
      resources:
        requests:
          cpu: 20m
          memory: 16Mi
        limits:
          cpu: 200m
          memory: 64Mi
      securityContext:
        readOnlyRootFilesystem: true
