apiVersion: v1
kind: Pod
metadata:
  name: audit-rootfs-failure
  namespace: student01
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      # The securityContext is deliberately absent. Admission succeeds because
      # the policy is Audit, while its PolicyReport result must be a failure.
