apiVersion: v1
kind: Pod
metadata:
  name: mentor-without-sidecar
  namespace: mentor
  labels:
    # The person policy must correct this value before the Istio rule runs.
    person: student
spec:
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        readOnlyRootFilesystem: true
