# These Secrets contain no token in Git. After they are applied, the Kubernetes
# token controller fills their data fields. Never export the resulting Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: mentor-user-token
  namespace: mentor
  annotations:
    kubernetes.io/service-account.name: mentor-user
type: kubernetes.io/service-account-token
