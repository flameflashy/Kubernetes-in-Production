apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-readonly-rootfs-audit
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  readonly-rootfs-audit.json: |-
    {
      "annotations": {"list": []},
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(count_over_time({createdBy=\"policy-reporter\", policy=\"require-readonly-root-filesystem\", status=\"fail\", namespace=~\"student.*\"}[$__range]))",
              "queryType": "instant",
              "refId": "A"
            }
          ],
          "title": "Read-only root filesystem audit failures in selected range",
          "type": "stat"
        },
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "gridPos": {"h": 15, "w": 24, "x": 0, "y": 6},
          "id": 2,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": true,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "{createdBy=\"policy-reporter\", policy=\"require-readonly-root-filesystem\", status=\"fail\", namespace=~\"student.*\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Kyverno read-only root filesystem audit log",
          "type": "logs"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 41,
      "tags": ["lab4", "kyverno", "audit", "logs"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "Read-only Root Filesystem Audit",
      "uid": "readonly-rootfs-audit",
      "version": 1
    }
