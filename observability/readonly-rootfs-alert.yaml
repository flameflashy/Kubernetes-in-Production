apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-readonly-rootfs-audit
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  readonly-rootfs-alert.yaml: |-
    apiVersion: 1
    groups:
      - orgId: 1
        name: kyverno-audit
        folder: Kubernetes Lab
        interval: 1m
        rules:
          - uid: readonly-rootfs-audit-failure
            title: Read-only root filesystem audit failure
            condition: C
            data:
              - refId: A
                datasourceUid: loki
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  datasource:
                    type: loki
                    uid: loki
                  editorMode: code
                  expr: 'sum(count_over_time({createdBy="policy-reporter", policy="require-readonly-root-filesystem", status="fail", namespace=~"student.*"}[5m]))'
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  queryType: instant
                  refId: A
              - refId: B
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  conditions: []
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  reducer: last
                  refId: B
                  type: reduce
              - refId: C
                datasourceUid: __expr__
                relativeTimeRange:
                  from: 0
                  to: 0
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - C
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: B
                  refId: C
                  type: threshold
            noDataState: OK
            execErrState: Error
            for: 0s
            annotations:
              summary: A student Pod failed the read-only root filesystem audit
              description: Kyverno reported a require-readonly-root-filesystem failure during the last five minutes.
            labels:
              severity: warning
              source: kyverno
            isPaused: false
